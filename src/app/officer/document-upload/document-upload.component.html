<div class="document-upload">
  <h5>Documents</h5>

  <div *ngIf="!caseRef" class="text-muted small">Save the case first to attach documents.</div>

  <div *ngIf="caseRef && editable" class="upload-controls row g-2 align-items-end">
    <div class="col-md-6">
      <label for="du-type" class="form-label">Document type</label>
      <select id="du-type" class="form-select form-select-sm"
              name="documentType" [(ngModel)]="documentType">
        <option *ngFor="let t of documentTypes" [value]="t">{{ t }}</option>
      </select>
    </div>
    <div class="col-md-6">
      <label for="du-file" class="form-label">Add document (image or PDF)</label>
      <input id="du-file" type="file" accept="image/*,application/pdf"
             class="form-control form-control-sm"
             [disabled]="uploading" (change)="onFileSelected($event)" />
    </div>
  </div>

  <div *ngIf="uploading" class="small text-info mt-2">Uploading…</div>
  <div *ngIf="error" class="small text-danger mt-2">{{ error }}</div>

  <ul class="doc-list mt-3">
    <li *ngIf="safeDocuments.length === 0" class="text-muted small">No documents yet.</li>
    <li *ngFor="let d of safeDocuments" class="doc-item">
      <span class="doc-type">{{ d.documentType }}</span>
      <span class="doc-name">{{ d.originalName || 'document' }}</span>
      <button *ngIf="editable" type="button" class="btn btn-sm btn-link text-danger p-0"
              (click)="removeDocument(d)">Remove</button>
    </li>
  </ul>

  <div *ngIf="editable && safeDocuments.length" class="mt-3">
    <button type="button" class="btn btn-primary btn-sm"
            [disabled]="analyzing || uploading"
            (click)="analyze.emit()">
      <i class="bi bi-stars me-1"></i>{{ analyzing ? 'Analyzing…' : 'Detect & analyze documents' }}
    </button>
  </div>
</div>
