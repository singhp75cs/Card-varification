<div class="photo-upload">
  <h5>Photos <span class="req">*</span></h5>

  <div *ngIf="!caseRef" class="text-muted small">Save the case first to attach photos.</div>

  <div *ngIf="caseRef && editable" class="upload-controls row g-2 align-items-end">
    <div class="col-md-4">
      <label for="pu-caption" class="form-label">Caption</label>
      <select id="pu-caption" class="form-select form-select-sm"
              name="caption" [(ngModel)]="caption">
        <option *ngFor="let c of captions" [value]="c">{{ c }}</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="pu-category" class="form-label">Category</label>
      <select id="pu-category" class="form-select form-select-sm"
              name="category" [(ngModel)]="category">
        <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="pu-file" class="form-label">Add photo</label>
      <input id="pu-file" type="file" accept="image/*" class="form-control form-control-sm"
             [disabled]="uploading" (change)="onFileSelected($event)" />
    </div>
  </div>

  <div *ngIf="uploading" class="small text-info mt-2">Uploading…</div>
  <div *ngIf="error" class="small text-danger mt-2">{{ error }}</div>

  <div class="thumb-grid mt-3">
    <div *ngIf="safePhotos.length === 0" class="text-muted small">No photos yet.</div>
    <figure class="thumb" *ngFor="let p of safePhotos">
      <img [src]="absUrl(p.url)" [alt]="p.caption || p.originalName || 'Photo'" />
      <figcaption>
        <span>{{ p.caption || p.originalName || 'Photo' }}</span>
        <button *ngIf="editable" type="button" class="btn btn-sm btn-link text-danger p-0"
                (click)="removePhoto(p)">Remove</button>
      </figcaption>
    </figure>
  </div>

  <div *ngIf="editable && safePhotos.length" class="mt-3">
    <button type="button" class="btn btn-primary btn-sm"
            [disabled]="analyzing || uploading"
            (click)="analyze.emit()">
      <i class="bi bi-stars me-1"></i>{{ analyzing ? 'Analyzing…' : 'Detect & analyze photos' }}
    </button>
  </div>
</div>
