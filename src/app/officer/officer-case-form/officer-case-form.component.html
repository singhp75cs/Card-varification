<div class="case-form container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">
      {{ isNew ? 'New Card Verification' : 'Case ' + caseRef }}
      <span *ngIf="detail" class="status-chip">{{ status }}</span>
    </h3>
    <button type="button" class="btn btn-outline-secondary" (click)="back()">Back to cases</button>
  </div>

  <!-- Correction banner -->
  <div *ngIf="needsCorrection && detail as d" class="alert alert-warning">
    <strong>Correction requested</strong>
    <span *ngIf="d.reviewer"> by {{ d.reviewer }}</span>:
    {{ d.reviewComment || 'Please review and resubmit.' }}
  </div>

  <div *ngIf="info" class="alert alert-success">{{ info }}</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Details -->
  <section class="card-block">
    <app-case-details-form
      [(model)]="details"
      [editable]="editable"
      (cardNumberValid)="cardNumberValid = $event">
    </app-case-details-form>
    <div class="mt-3">
      <button type="button" class="btn btn-primary"
              [disabled]="saving || !editable || !cardNumberValid"
              (click)="saveDetails()">
        {{ isNew ? 'Create case' : 'Save details' }}
      </button>
    </div>
  </section>

  <!-- Photos / Documents / GPS (only once a case exists) -->
  <section class="card-block" *ngIf="!isNew">
    <app-photo-upload
      [caseRef]="caseRef"
      [(photos)]="photos"
      [editable]="editable"
      [analyzing]="analyzing"
      (analyze)="analyze()">
    </app-photo-upload>
  </section>

  <section class="card-block" *ngIf="!isNew">
    <app-document-upload
      [caseRef]="caseRef"
      [(documents)]="documents"
      [editable]="editable"
      [analyzing]="analyzing"
      (analyze)="analyze()">
    </app-document-upload>
  </section>

  <section class="card-block" *ngIf="!isNew">
    <app-gps-capture
      [caseRef]="caseRef"
      [latitude]="detail?.latitude ?? null"
      [longitude]="detail?.longitude ?? null"
      [gpsStatus]="detail?.gpsStatus ?? 'unavailable'"
      [editable]="editable">
    </app-gps-capture>
  </section>

  <!-- AI detection/analysis results (after Detect & analyze, or after submit) -->
  <section class="card-block" *ngIf="detail && detail.aiResults.length">
    <app-ai-results-view
      [results]="detail.aiResults"
      [photos]="photos"
      [documents]="documents">
    </app-ai-results-view>
  </section>

  <!-- Submit / Resubmit -->
  <section class="card-block" *ngIf="!isNew && editable">
    <button type="button" class="btn btn-success btn-lg" [disabled]="saving"
            (click)="submit()">
      {{ submitLabel }}
    </button>
  </section>
</div>
