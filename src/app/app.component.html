<header class="header d-flex justify-content-between align-items-center px-5">

  <!-- Brand (click → home) -->
  <div class="brand d-flex align-items-center gap-2"
       role="button"
       tabindex="0"
       (click)="goHome()"
       (keydown.enter)="goHome()"
       (keydown.space)="goHome()">
    <div class="brand-icon">
      <i class="bi bi-grid-3x3-gap-fill"></i>
    </div>
    <span class="brand-title">Card Verification</span>
  </div>

  <!-- Center: role-aware nav -->
  <nav class="d-flex align-items-center gap-3" *ngIf="isLoggedIn">
    <a class="nav-link-item" routerLink="/office/overview" routerLinkActive="active">Dashboard</a>
    <ng-container *ngIf="isFieldOfficer">
      <a class="nav-link-item" routerLink="/officer/cases" routerLinkActive="active">My Cases</a>
      <a class="nav-link-item" routerLink="/officer/cases/new" routerLinkActive="active">New Case</a>
    </ng-container>
    <ng-container *ngIf="isFrontOffice">
      <a class="nav-link-item" routerLink="/office/review" routerLinkActive="active">Review Queue</a>
      <a class="nav-link-item" routerLink="/office/completed" routerLinkActive="active">Completed</a>
    </ng-container>
  </nav>

  <!-- Right: user info -->
  <div class="d-flex align-items-center user-section gap-3">
    <ng-container *ngIf="isLoggedIn">
      <div class="user-chip d-flex align-items-center gap-2">
        <div class="avatar"><i class="bi bi-person-fill"></i></div>
        <span class="username">{{ username }}</span>
      </div>
      <button class="btn logout-btn fw-semibold" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </ng-container>
  </div>

</header>

<router-outlet></router-outlet>
