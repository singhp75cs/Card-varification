<div class="review-queue container-fluid py-4">
  <h3 class="mb-3">Review Queue</h3>
  <p class="text-muted">Submitted cases awaiting review.</p>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <ag-grid-angular
    class="grid"
    [theme]="theme"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[10, 25, 50]"
    [animateRows]="true"
    (gridReady)="onGridReady($event)"
    (rowClicked)="onRowClicked($event)">
  </ag-grid-angular>
</div>
