<div class="container mt-5" style="max-width: 400px;">
  <h3>Register</h3>
  <form (ngSubmit)="onRegister()" #registerForm="ngForm">
    <div class="form-group mb-3">
      <label for="signup-name">Name</label>
      <input id="signup-name" type="text" [(ngModel)]="name" name="name" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <label for="signup-email">Email</label>
      <input id="signup-email" type="email" [(ngModel)]="email" name="email" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <label for="signup-password">Password</label>
      <input id="signup-password" type="password" [(ngModel)]="password" name="password" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <label for="signup-role">Role</label>
      <select id="signup-role" [(ngModel)]="role" name="role" class="form-select" required>
        <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success w-100" [disabled]="!registerForm.valid">Register</button>

    <div *ngIf="message" class="alert alert-info mt-3">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
  </form>
  <p class="mt-3">Already have an account? <a routerLink="/login">Login Page</a></p>
</div>
